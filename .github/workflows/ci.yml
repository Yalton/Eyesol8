name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e . pytest
      - name: Unit tests
        run: >-
          python -m pytest -q
          tests/test_adapter.py::test_fixture_uses_the_shipped_addon
          tests/test_adapter.py::test_port_line_is_caught_even_after_ring_buffer_evicts_it
          tests/test_session.py::test_missing_gamescope_raises_clear_error
          tests/test_session.py::test_logs_ring_buffer_filters
          tests/test_xvfb.py::test_unknown_backend_is_rejected
          tests/test_xvfb.py::test_missing_xvfb_raises_clear_error
